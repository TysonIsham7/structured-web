name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r language/validator/requirements.txt
      - name: Validate examples
        run: |
          for f in language/examples/*.json; do
            python language/validator/validate.py "$f" || exit 1
          done
      - name: Run tests
        run: python -m pytest language/validator/tests/ -v

  # library/ and protocol/ already contain SPEC.md, so a blanket
  # hashFiles('library/**') guard would still match and those jobs would
  # fail. hashFiles() is also illegal on a job-level if: GitHub rejects it
  # as an unrecognized function, and the workspace is empty before checkout.
  # After checkout, hash the requirements file each job installs. The job
  # stays skipped until that file exists.
  layer-presence:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.gate.outputs.library }}
      protocol: ${{ steps.gate.outputs.protocol }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          echo "library=${{ hashFiles('library/requirements.txt') != '' }}" >> "$GITHUB_OUTPUT"
          echo "protocol=${{ hashFiles('protocol/requirements.txt') != '' }}" >> "$GITHUB_OUTPUT"

  library:
    needs: layer-presence
    if: needs.layer-presence.outputs.library == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r library/requirements.txt
      - name: Run render tests
        run: python -m pytest library/render/tests/ -v
      - name: Run agent tests
        run: python -m pytest library/agent/tests/ -v
      - name: Run usage example
        run: python library/examples/usage.py

  protocol:
    needs: layer-presence
    if: needs.layer-presence.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r protocol/requirements.txt
      - name: Run server and integration tests
        run: |
          python protocol/server/main.py &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          python -c "from protocol.server.app import wait_until_ready; wait_until_ready()"
          python -m pytest protocol/tests/ -v
          python -m pytest examples/integration-fixture/test_integration.py -v

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}$" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --no-banner --redact
